<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Username Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Title -->
        <h1>Username Generator</h1>
        <!-- Form Section -->
        <div class="form-section">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" placeholder="Enter your first name" autocomplete="off">
            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" placeholder="Enter your last name" autocomplete="off">
        </div>
        <!-- Options Section -->
        <div class="options-section">
            <h2>Options</h2>
            <label><input type="checkbox" id="addnumber"> Add Numbers</label>
            <label><input type="checkbox" id="addunderscore"> Add Underscore</label>
            <label><input type="checkbox" id="uppercase"> Convert To Uppercase</label>
        </div>
        <!-- Result Section -->
        <div class="result-section">
            <button id="generate-btn">Generate Username</button>
            <div class="generated-username-block">
                <label for="display-username">Generated Username</label>
                <div id="display-username" class="generated-username">john_doe123</div>
                <button id="copy-btn">Copy</button>
                <span id="copy-feedback" style="display:none; color:green; margin-left:8px;">Copied!</span>
            </div>
        </div>
        <!-- (Bonus) History Section could go here -->
    </div>
    <script src="script.js"></script>
</body>
</html>
