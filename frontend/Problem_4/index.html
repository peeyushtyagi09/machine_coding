<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Stopwatch</h1>

        <div id="timer">
            00:00:00
        </div>

        <div class="button-container">

            <button id="start-btn">
                Start
            </button>

            <button id="pause-btn">
                Pause
            </button>

            <button id="reset-btn">
                Reset
            </button>

            <button id="lap-btn">
                Lap
            </button>

        </div>

        <div class="lap-container">

            <h2>Laps</h2>

            <ul id="lap-list">
            </ul>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
