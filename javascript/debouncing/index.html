<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        h1 {
            margin-bottom: 20px;
        }

        #loading {
            display: none;
            margin-bottom: 20px;
        }

        #error {
            color: red;
            margin-bottom: 20px;
        }

        /* Improved input box styles */
        #searchInput {
            display: block;
            width: 350px;
            max-width: 100%;
            font-size: 1rem;
            padding: 10px 16px;
            margin-bottom: 24px;
            border: 1.5px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            transition: border 0.2s, box-shadow 0.2s;
            outline: none;
            background-color: #fafbfc;
        }

        #searchInput:focus {
            border-color: #84b9fa;
            box-shadow: 0 0 0 2px rgba(60,140,255,0.08);
            background-color: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f5f5f5;
        }

        img {
            width: 80px;
            height: 80px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <h1>Product List</h1>
    <input
        type="text"
        id="searchInput"
        placeholder="Search products..."
    >

    <div id="loading">
        Loading products...
    </div>

    <div id="error"></div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Category</th>
                <th>Price</th>
                <th>Image</th>
            </tr>
        </thead>

        <tbody id="productList">
            <!-- Products will be inserted here -->
        </tbody>
    </table>

    <script src="index.js"></script>

</body>
</html>
