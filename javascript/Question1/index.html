<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: #f4f6fa;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1{
            color: red;
        }
        form {
            background: #fff;
            padding: 2rem 2.5rem;
            border-radius: 18px;
            box-shadow: 0 2px 10px rgba(51, 75, 106, 0.06);
            max-width: 400px;
            width: 100%;
        }
        form > div {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border-radius: 7px;
            border: 1.5px solid #cdd6e1;
            font-size: 1rem;
            transition: border-color 0.2s;
            box-sizing: border-box;
            outline: none;
            background: #f9fafc;
        }
        input:focus {
            border-color: #4f8cff;
            background: #fff;
        }
        .error-message {
            color: #e23c47;
            font-size: 0.93em;
            margin-top: 4px;
            min-height: 18px;
        }
        button[type="submit"], button[type="reset"] {
            padding: 0.7rem 2.2rem;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 9px;
            margin-right: 10px;
            transition: background 0.18s, color 0.18s, box-shadow 0.15s;
            box-shadow: 0 1px 4px rgba(68, 125, 255, 0.05);
        }
        button[type="submit"] {
            background: #397eff;
            color: #fff;
        }
        button[type="submit"]:disabled {
            background: #a0b8e5;
            cursor: not-allowed;
        }
        button[type="reset"] {
            background: #f3f6fc;
            color: #447DFF;
            border: 1px solid #d1e0fa;
        }
        button[type="reset"]:hover {
            background: #e3edff;
        }
        .form-title {
            text-align: center;
            font-size: 1.66rem;
            font-weight: 700;
            margin-bottom: 1.3rem;
            letter-spacing: -.01em;
            color: #3361a4;
        }
        @media (max-width: 450px) {
            form {
                padding: 1.2rem 0.7rem;
                border-radius: 8px;
            }
            .form-title {
                font-size: 1.15rem;
            }
        }
    </style>
</head>
<body>
    <form id="form" autocomplete="off" novalidate>
        <div class="form-title">Create Your Account</div>
        <div>
            <label for="name">Name <span style="color:#e23c47">*</span></label>
            <input type="text" id="name" name="name" required autocomplete="off" placeholder="Enter your full name" />
            <div class="error-message" id="name-error"></div>
        </div>
        <div>
            <label for="email">Email <span style="color:#e23c47">*</span></label>
            <input type="email" id="email" name="email" required autocomplete="off" placeholder="e.g. your@email.com" />
            <div class="error-message" id="email-error"></div>
        </div>
        <div>
            <label for="password">Password <span style="color:#e23c47">*</span></label>
            <input type="password" id="password" name="password" required autocomplete="off" placeholder="At least 6 characters" />
            <div class="error-message" id="password-error"></div>
        </div>
        <div>
            <label for="confirm-password">Confirm Password <span style="color:#e23c47">*</span></label>
            <input type="password" id="confirm-password" name="confirm-password" required autocomplete="off" placeholder="Type your password again" />
            <div class="error-message" id="confirm-password-error"></div>
        </div>
        <button type="submit" id="submit-btn">Submit</button>
        <button type="reset" id="reset-btn">Reset</button>
    </form>
    <script src="index.js"></script>
</body>
</html>
