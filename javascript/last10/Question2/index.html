<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary: #4267b2;
            --accent: #61dafb;
            --background: #f7f9fa;
            --border: #e1e6ee;
            --danger: #ff5252;
            --radius: 14px;
            --highlight: #e6eeff;
            --shadow: 0 6px 24px #ced9ea33;
        }
        body {
            margin: 0;
            background: var(--background);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #24334c;
        }
        #main {
            max-width: 430px;
            margin: 48px auto;
            background: #fff;
            box-shadow: var(--shadow);
            border-radius: var(--radius);
            padding: 42px 30px 30px 30px;
        }
        h1.title-main {
            margin-top: 0;
            font-size: 2.2em;
            line-height: 1.1;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 12px;
            letter-spacing: .8px;
            text-align: center;
        }
        .subtitle {
            color: #566487;
            text-align: center;
            margin-bottom: 32px;
            font-size: 1em;
            font-weight: 500;
            letter-spacing: .03em;
        }
        h2 {
            font-size: 1.23em;
            font-weight: 700;
            margin-bottom: 18px;
            color: var(--primary);
            letter-spacing: .4px;
        }
        form#addExpense {
            display: flex;
            flex-direction: column;
            gap: 13px;
            border-bottom: 1.6px solid var(--border);
            padding-bottom: 28px;
            margin-bottom: 22px;
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            position: relative;
        }
        label {
            font-weight: 500;
            color: #415072;
            margin-bottom: 0;
            margin-left: 2px;
            font-size: 0.98em;
        }
        input[type="number"],
        input[type="string"],
        input[type="text"],
        input[type="date"] {
            padding: 11px 13px;
            border: 1.5px solid var(--border);
            border-radius: 9px;
            font-size: 1em;
            background: #f4f7fc;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.18s;
            margin-bottom: 1px;
        }
        input:focus {
            border-color: var(--primary);
            outline: none;
            background: #fff;
            box-shadow: 0 2px 14px #4267b215;
        }
        .error-message {
            color: var(--danger);
            font-size: 0.97em;
            margin-top: 1px;
            min-height: 20px;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        button[type="submit"] {
            background: linear-gradient(90deg, var(--primary) 85%, var(--accent));
            color: #fff;
            border: none;
            border-radius: 9px;
            font-size: 1.07em;
            font-weight: 600;
            padding: 11px 0;
            flex: 1 0 0px;
            cursor: pointer;
            transition: background 0.15s, box-shadow 0.12s, transform 0.12s;
            box-shadow: 0 2px 11px #dde3f655;
        }
        button[type="submit"]:hover,
        button[type="submit"]:focus {
            background: linear-gradient(90deg, #294c89 70%, #395980 100%);
            box-shadow: 0 5px 17px #e2ebfa55;
            transform: translateY(-1px) scale(1.03);
        }
        button[type="button"], button[type="reset"] {
            background: #fff;
            color: var(--danger);
            border: 1.2px solid var(--danger);
            border-radius: 9px;
            font-weight: 600;
            padding: 11px 0;
            flex: 1 0 0px;
            cursor: pointer;
            transition: background 0.13s, color 0.13s, border-color 0.13s, box-shadow 0.08s;
        }
        button[type="button"]:hover,
        button[type="reset"]:hover {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
            box-shadow: 0 1px 8px #ff525233;
        }
        #form_error {
            min-height: 22px;
            color: var(--danger);
            font-size: 1em;
            margin-top: 8px;
            text-align: center;
            font-weight: 500;
        }
        #search {
            width: 100%;
            margin: 17px 0 18px 0;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: 9px;
            font-size: 1.03em;
            background: #f8faff;
            transition: border-color 0.2s, background 0.2s;
        }
        #search:focus {
            border-color: var(--primary);
            outline: none;
            background: #fff;
        }
        #summary-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--highlight);
            border-radius: 10px;
            padding: 10px 15px 10px 15px;
            margin-bottom: 10px;
            margin-top: 2px;
        }
        .summary-block {
            text-align: center;
        }
        .summary-label {
            display: block;
            color: #6374a3;
            font-size: 0.92em;
            font-weight: 500;
            margin-bottom: 2.5px;
        }
        .summary-value {
            font-size: 1.25em;
            font-weight: 700;
            color: var(--primary);
        }
        #allExpense {
            margin-top: 2px;
            min-height: 60px;
        }
        @media (max-width: 650px) {
            #main {
                padding: 18px 2vw;
                max-width: 98%;
            }
        }
        @media (max-width: 440px) {
            #main {
                padding: 9px 1vw;
            }
            h1.title-main {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div id="main">
        <h1 class="title-main">
            Expense Tracker
        </h1>
        <div class="subtitle">
            Keep track of your daily spending with ease and clarity.
        </div>
        <form id="addExpense" autocomplete="off" novalidate>
            <div class="field-group">
                <label for="expense_id">Expense ID</label>
                <input id="expense_id" type="number" required placeholder="e.g. 1" min="1" autocomplete="off"/>
                <div id="expense_id_error" class="error-message" style="display:none;"></div>
            </div>
            <div class="field-group">
                <label for="expense_title">Title</label>
                <input id="expense_title" type="text" required placeholder="e.g. Uber, Groceries" autocomplete="off"/>
                <div id="expense_title_error" class="error-message" style="display:none;"></div>
            </div>
            <div class="field-group">
                <label for="expense_amount">Amount ($)</label>
                <input id="expense_amount" type="number" required placeholder="e.g. 14.99" min="0" step="0.01" autocomplete="off"/>
                <div id="expense_amount_error" class="error-message" style="display:none;"></div>
            </div>
            <div class="field-group">
                <label for="expense_category">Category</label>
                <input id="expense_category" type="text" required placeholder="e.g. Food, Travel, Shopping" autocomplete="off"/>
                <div id="expense_category_error" class="error-message" style="display:none;"></div>
            </div>
            <div class="field-group">
                <label for="expense_date">Date</label>
                <input id="expense_date" type="date" required autocomplete="off"/>
                <div id="expense_date_error" class="error-message" style="display:none;"></div>
            </div>
            
            <div class="form-actions">
                <button id="submit_btn" type="submit">Add Expense</button>
                <button id="reset_btn" type="reset">Reset</button>
            </div>
            <div id="form_error"></div>
        </form>

        <input id="search" type="text" placeholder="🔎 Search your expenses by title, category, date..." aria-label="Search expenses..." />

        <div id="summary-bar">
            <div class="summary-block">
                <span class="summary-label">Total Records</span>
                <span id="totalexpenses" class="summary-value">0</span>
            </div>
            <div class="summary-block" style="border-left: 1px solid #e1e6ee; padding-left: 12px;">
                <span class="summary-label">Total Amount</span>
                <span id="total_amount" class="summary-value">$0</span>
            </div>
        </div>

        <div id="allExpense"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
